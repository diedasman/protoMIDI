CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Keep USB/BLE wake and sleep support enabled on the battery-powered controller.
CONFIG_ZMK_SLEEP=y

# This build is edited over a physical USB connection, so it starts unlocked.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=n

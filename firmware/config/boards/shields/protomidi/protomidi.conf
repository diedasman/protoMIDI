# Rev A full starting point: matrix, encoder, OLED, USB/BLE HID.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Keep power management available early, but validate wake behavior on hardware.
CONFIG_ZMK_SLEEP=y

# SSD1309 module using Zephyr's SSD1306-compatible I2C driver.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_16=y

# Deferred until hardware validation:
# CONFIG_ZMK_BACKLIGHT=y
